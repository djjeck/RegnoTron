name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # MegaBotTron1999, the shell the modules are developed against, is a submodule.
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Formatting, lint, types, and the tests with the coverage rule for each module: the same
      # checks as `npm run validate`, without fixing anything. There is no image (D49).
      - name: Check
        run: npm run ci
